<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Conecta Agro — Painel de Controle</title>
  <meta name="description" content="Sistema de registro e consulta de medições agronômicas.">

  <!-- Fontes Editoriais (Inter & Cormorant Garamond) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;500;600&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

  <!-- Tokens e Estilos da Aplicação -->
  <link rel="stylesheet" href="../design-system.css">
  <link rel="stylesheet" href="style.css">
</head>
<body class="arva-app">

  <!-- =========================================================================
       1. CABEÇALHO SUPERIOR (FOREST HEADER)
       ========================================================================= -->
  <header class="arva-header" id="main-header">
    <div class="arva-header__inner">
      <a href="../index.html" class="arva-brand">
        <span class="arva-brand__icon">▲</span> arva <span class="arva-brand__sub">| Conecta Agro</span>
      </a>

      <div class="arva-header__actions">
        <div class="arva-status" title="Dados locais">
          <span class="arva-status__dot"></span>
          Modo Local
        </div>
        <button id="btn-demo-seed" class="btn-pill btn-pill--ghost btn-demo">
          Restaurar Demo
        </button>
      </div>
    </div>
  </header>

  <!-- =========================================================================
       CONTEÚDO PRINCIPAL (BONE CANVAS)
       ========================================================================= -->
  <div class="arva-container">

    <!-- 2. FAIXA DE MÉTRICAS RÁPIDAS (QUILTED PASTEL CARDS) -->
    <section class="arva-section" aria-label="Métricas de Campo">
      <div class="arva-kpi-grid">
        
        <!-- Total -->
        <div class="arva-card quilt-sky" id="kpi-card-total">
          <div class="kpi-header">
            <span class="kpi-icon">🌾</span>
          </div>
          <div class="kpi-body">
            <div class="kpi-value" id="kpi-total-val">0</div>
            <span class="kpi-label">Total Medições</span>
          </div>
        </div>

        <!-- Umidade -->
        <div class="arva-card quilt-peach" id="kpi-card-moisture">
          <div class="kpi-header">
            <span class="kpi-icon">💧</span>
          </div>
          <div class="kpi-body">
            <div class="kpi-value" id="kpi-moisture-val">--%</div>
            <span class="kpi-label">Umidade Média</span>
          </div>
        </div>

        <!-- Temperatura -->
        <div class="arva-card quilt-sage" id="kpi-card-temp">
          <div class="kpi-header">
            <span class="kpi-icon">🌡️</span>
          </div>
          <div class="kpi-body">
            <div class="kpi-value" id="kpi-temp-val">--°C</div>
            <span class="kpi-label">Temp. Média</span>
          </div>
        </div>

        <!-- Alertas -->
        <div class="arva-card quilt-bone" id="kpi-card-alerts">
          <div class="kpi-header">
            <span class="kpi-icon">⚠️</span>
          </div>
          <div class="kpi-body">
            <div class="kpi-value" id="kpi-alerts-val">0</div>
            <span class="kpi-label">Em Alerta</span>
          </div>
        </div>

      </div>
    </section>

    <!-- 3. ÁREA DE TRABALHO PRINCIPAL -->
    <main class="arva-main-grid" id="main-content">

      <!-- =====================================================================
           COLUNA 1: FORMULÁRIO DE REGISTRO
           ===================================================================== -->
      <section class="arva-panel" aria-labelledby="form-title">
        <header class="panel-header">
          <h2 id="form-title" class="panel-title">Nova Medição</h2>
          <p class="panel-subtitle">Registre as observações do talhão.</p>
        </header>

        <form id="form-measurement" novalidate class="arva-form">

          <div class="form-row">
            <div class="form-group">
              <label for="input-datetime" class="form-label">Data e Hora <span class="req">*</span></label>
              <input type="datetime-local" id="input-datetime" name="dateTime" class="form-input pill-input" required>
            </div>
            <div class="form-group">
              <label for="input-field" class="form-label">Talhão / Lote <span class="req">*</span></label>
              <input type="text" id="input-field" name="field" class="form-input pill-input" placeholder="Ex: Talhão 04" list="fields-suggestions" required>
              <datalist id="fields-suggestions">
                <option value="Talhão 01 - Baixada">
                <option value="Talhão 02 - Encosta Leste">
                <option value="Talhão 03 - Pivô Central">
                <option value="Talhão 04 - Setor Norte">
                <option value="Talhão 08 - Colina Sul">
              </datalist>
            </div>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label for="input-crop" class="form-label">Cultura <span class="req">*</span></label>
              <input type="text" id="input-crop" name="crop" class="form-input pill-input" placeholder="Ex: Milho Safrinha" list="crops-suggestions" required>
              <datalist id="crops-suggestions">
                <option value="Milho Safrinha DKB">
                <option value="Soja Intacta BMX">
                <option value="Café Arábica Catuaí">
                <option value="Feijão Carioca">
                <option value="Algodão DP 1744">
              </datalist>
            </div>
            <div class="form-group">
              <label for="input-moisture" class="form-label">Umidade Solo (%) <span class="req">*</span></label>
              <div class="input-affix">
                <input type="number" id="input-moisture" name="soilMoisture" class="form-input pill-input" placeholder="0 a 100" min="0" max="100" step="0.1" required>
                <span class="affix-text">%</span>
              </div>
            </div>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label for="input-temp" class="form-label">Temperatura (°C) <span class="req">*</span></label>
              <div class="input-affix">
                <input type="number" id="input-temp" name="temperature" class="form-input pill-input" placeholder="Ex: 29.5" min="-10" max="60" step="0.1" required>
                <span class="affix-text">°C</span>
              </div>
            </div>
          </div>

          <div class="form-group">
            <label class="form-label" id="label-pest-status">Status de Pragas / Risco <span class="req">*</span></label>
            <div class="segmented-pills" role="radiogroup" aria-labelledby="label-pest-status">
              <label class="pill-radio pill-safe">
                <input type="radio" name="pestStatus" value="safe" checked>
                <span>Normal</span>
              </label>
              <label class="pill-radio pill-warn">
                <input type="radio" name="pestStatus" value="warn">
                <span>Atenção</span>
              </label>
              <label class="pill-radio pill-alert">
                <input type="radio" name="pestStatus" value="alert">
                <span>Alerta</span>
              </label>
              <label class="pill-radio pill-danger">
                <input type="radio" name="pestStatus" value="danger">
                <span>Crítico</span>
              </label>
            </div>
          </div>

          <div class="form-group">
            <label for="input-observations" class="form-label">Observações</label>
            <textarea id="input-observations" name="observations" class="form-textarea pill-input" placeholder="Descreva sintomas, ações..."></textarea>
          </div>

          <div class="form-actions">
            <button type="submit" id="btn-submit-measurement" class="btn-pill btn-pill--primary" style="flex: 2;">Salvar Medição</button>
            <button type="reset" id="btn-reset-form" class="btn-pill btn-pill--dark-ghost" style="flex: 1;">Limpar</button>
          </div>

        </form>
      </section>

      <!-- =====================================================================
           COLUNA 2: HISTÓRICO
           ===================================================================== -->
      <section class="arva-panel" aria-labelledby="records-title">
        <header class="panel-header" style="display: flex; justify-content: space-between; align-items: flex-end;">
          <div>
            <h2 id="records-title" class="panel-title">Histórico</h2>
            <p class="panel-subtitle" id="records-counter-text">Carregando...</p>
          </div>
        </header>

        <div class="filter-bar">
          <div class="search-box">
            <input type="text" id="search-input" class="form-input pill-input" placeholder="Buscar talhão ou cultura...">
            <button type="button" id="btn-clear-search" class="btn-clear" style="display: none;">✕</button>
          </div>
          <select id="filter-status-select" class="form-input pill-input select-filter">
            <option value="all">Todos os Status</option>
            <option value="safe">Normal</option>
            <option value="warn">Atenção</option>
            <option value="alert">Alerta</option>
            <option value="danger">Crítico</option>
          </select>
        </div>

        <div id="records-container" class="records-list" role="region" aria-live="polite">
          <!-- Dinâmico -->
        </div>

        <div id="empty-state" class="empty-state" style="display: none;">
          <h3 class="empty-title">Vazio</h3>
          <p class="empty-desc" id="empty-state-message">Nenhuma medição encontrada.</p>
          <button type="button" id="btn-empty-reset" class="btn-pill btn-pill--dark-ghost" style="margin-top: 16px;">Limpar Filtros</button>
        </div>

      </section>

    </main>
  </div>

  <!-- Toast Notificações -->
  <div id="toast-container" class="toast-container" aria-live="assertive"></div>

  <script src="app.js"></script>
</body>
</html>
